<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simplicity</title>
<link rel="preload" href="fonts/simplicity-pixel.ttf" as="font" type="font/ttf" crossorigin>
<style>
  /* Simplicity Pixel (built by tools/build_font.py) is the only font. Its glyph pixels are 1/6 of the
     font size, so keep every size a multiple of 6 (12, 18, 24, 36) and the text stays crisp. */
  @font-face { font-family: "Simplicity Pixel"; src: url("fonts/simplicity-pixel.ttf") format("truetype"); font-display: block; }
  :root {
    --ink: #14101e; --void: #2b2438; --bone: #f2ead8; --stone: #b8ad9c; --glow: #f5d562;
    --oak: #8b5a34; --bark: #4f3222; --magic: #7fa6ff; --moss: #5fb04a; --ember: #c8423a;
    --pixel: "Simplicity Pixel", monospace;
  }
  * { font-family: var(--pixel); font-weight: normal; font-style: normal; letter-spacing: 0; -webkit-font-smoothing: none; font-smooth: never; text-rendering: optimizeSpeed; }
  html, body { margin: 0; height: 100%; background: var(--ink); overflow: hidden; cursor: crosshair; user-select: none; -webkit-user-select: none; }  /* clicks and drags never select text */
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
  #hudCanvas { pointer-events: none; }
  .hud { position: fixed; top: 12px; right: 16px; color: var(--bone); font-size: 12px; line-height: 18px; text-shadow: 2px 2px 0 var(--ink); text-align: right; }
  .hud small { display: block; font-size: 12px; color: var(--stone); }
  .overlay { position: fixed; inset: 0; display: grid; place-items: center; background: rgb(20 16 30 / 0.72); color: var(--bone); font-size: 12px; line-height: 24px; text-align: center; z-index: 50; }
  .overlay[hidden] { display: none; }
  .overlay h1 { font-size: 48px; line-height: 60px; margin: 0 0 18px; color: var(--glow); text-shadow: 6px 6px 0 var(--bark); }
  .overlay p { margin: 0; }
  .overlay .keys { color: var(--stone); margin-top: 18px; }

  /* ---------- Inventory panel ---------- */
  #inventory {
    position: fixed; right: 16px; top: 50%; transform: translateY(-50%); z-index: 20;
    padding: 12px 14px 14px; color: var(--bone); font-size: 12px; line-height: 18px; cursor: default;
    background: linear-gradient(#231b30, #15111f);
    border: 2px solid var(--bark);
    box-shadow: inset 0 0 0 1px var(--oak), inset 0 0 0 3px #1a1424, 0 12px 32px rgb(0 0 0 / 0.6);
  }
  #inventory[hidden] { display: none; }
  #inventory h2 { font-size: 18px; line-height: 24px; text-align: center; color: var(--glow); margin: 0 0 8px; text-shadow: 3px 3px 0 var(--bark); }
  #invEquip { position: relative; width: 320px; height: 224px; }
  .slot { position: absolute; box-sizing: border-box; background: rgb(0 0 0 / 0.35); border: 1px solid var(--bark); display: grid; place-items: center; }
  .slot .ghost { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; opacity: 0.14; filter: grayscale(1); pointer-events: none; }
  #invStats { display: flex; flex-wrap: wrap; justify-content: center; gap: 0 14px; margin: 10px 0; color: var(--stone); font-size: 12px; line-height: 18px; }
  #invStats b { color: var(--bone); }
  #invGrid {
    position: relative; width: 320px; height: 160px; box-sizing: content-box;
    border: 1px solid var(--bark); background-color: rgb(0 0 0 / 0.35);
    background-image: linear-gradient(var(--void) 1px, transparent 1px), linear-gradient(90deg, var(--void) 1px, transparent 1px);
    background-size: 32px 32px;
  }
  .item { position: absolute; box-sizing: border-box; display: grid; place-items: center; cursor: pointer; }
  .item img { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; pointer-events: none; }
  .item:hover { outline: 1px solid var(--bone); outline-offset: -1px; }
  .item.rarity-normal { background: rgb(184 173 156 / 0.10); }
  .item.rarity-magic { background: rgb(63 111 208 / 0.25); }
  .item.rarity-rare { background: rgb(245 213 98 / 0.16); }
  .preview { position: absolute; pointer-events: none; background: rgb(95 176 74 / 0.25); outline: 1px solid var(--moss); outline-offset: -1px; }
  .preview.bad { background: rgb(200 66 58 / 0.25); outline-color: var(--ember); }
  #held { position: fixed; z-index: 30; pointer-events: none; opacity: 0.9; }
  #held[hidden], .preview[hidden] { display: none; }

  /* ---------- Tooltip, ground labels, toast ---------- */
  #tooltip {
    position: fixed; z-index: 40; pointer-events: none; min-width: 170px; padding: 8px 14px 10px; text-align: center;
    background: rgb(14 11 22 / 0.96); border: 1px solid var(--oak); color: var(--stone); font-size: 12px; line-height: 18px;
  }
  #tooltip[hidden], #toast[hidden] { display: none; }
  .tip-name { font-size: 12px; margin-bottom: 2px; }
  .tip-base { color: var(--bone); }
  .tip-slot { color: #6b5f78; margin-bottom: 4px; }
  .tip-stat { color: var(--bone); }
  .tip-mod { color: var(--magic); }
  .tip-name.rarity-normal, .label.rarity-normal { color: var(--bone); }
  .tip-name.rarity-magic, .label.rarity-magic { color: var(--magic); }
  .tip-name.rarity-rare, .label.rarity-rare { color: var(--glow); }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 10; overflow: hidden; }
  .label { position: absolute; left: 0; top: 0; padding: 1px 7px; white-space: nowrap; font-size: 12px; line-height: 18px; background: rgb(14 11 22 / 0.78); border: 1px solid rgb(139 90 52 / 0.7); }
  #toast.good { color: var(--glow); }
  .tip-note { color: #6b5f78; }
  #alert { position: fixed; left: 0; top: 0; z-index: 12; pointer-events: none; font-size: 36px; line-height: 36px; color: var(--glow); text-shadow: 2px 2px 0 var(--ink), 0 0 12px rgb(245 213 98 / 0.6); animation: pop 0.25s ease-out; }
  #alert[hidden] { display: none; }
  @keyframes pop { from { scale: 0.4; } to { scale: 1; } }
  #resetHold { position: fixed; bottom: 62px; left: 50%; transform: translateX(-50%); z-index: 45; text-align: center; color: var(--bone); font-size: 12px; line-height: 18px; text-shadow: 2px 2px 0 var(--ink); }
  #resetHold[hidden] { display: none; }
  #resetHold .bar { width: 180px; height: 6px; margin-top: 6px; background: rgb(14 11 22 / 0.8); border: 1px solid var(--oak); }
  #resetHold i { display: block; height: 100%; width: 0; background: var(--ember); }
  #toast { position: fixed; top: 18%; left: 50%; transform: translateX(-50%); z-index: 45; color: var(--ember); font-size: 18px; line-height: 24px; text-shadow: 3px 3px 0 var(--ink); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<canvas id="hudCanvas"></canvas>
<div id="labels"></div>
<div class="hud"><span id="hud"></span><small>I: inventory &middot; hold R: reset</small></div>

<div id="inventory" hidden>
  <h2>INVENTORY</h2>
  <div id="invEquip"></div>
  <div id="invStats"></div>
  <div id="invGrid"></div>
</div>
<div id="held" hidden></div>
<div id="tooltip" hidden></div>
<div id="toast" hidden></div>
<div id="alert" hidden>!</div>
<div id="resetHold" hidden>RESETTING<div class="bar"><i></i></div></div>

<div class="overlay" id="overlay">
  <div>
    <h1>SIMPLICITY</h1>
    <p id="message">Press any key to begin</p>
    <p class="keys">WASD / arrows: move &middot; double-tap: dash<br>Mouse: aim &middot; Click / J: attack &middot; Space: jump<br>I: inventory &middot; Hold R: reset</p>
  </div>
</div>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
<script src="sprites.js"></script>
<script src="font.js"></script>
<script type="module" src="main.js"></script>
</body>
</html>
