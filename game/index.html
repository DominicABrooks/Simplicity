<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simplicity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap">
<style>
  :root {
    --ink: #14101e; --void: #2b2438; --bone: #f2ead8; --stone: #b8ad9c; --glow: #f5d562;
    --oak: #8b5a34; --bark: #4f3222; --magic: #7fa6ff; --moss: #5fb04a; --ember: #c8423a;
    --title: "Cinzel", Georgia, serif;
    --ui: system-ui, "Segoe UI", sans-serif;
  }
  html, body { margin: 0; height: 100%; background: var(--ink); overflow: hidden; cursor: crosshair; }
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
  #hudCanvas { pointer-events: none; }
  .hud { position: fixed; top: 12px; right: 16px; color: var(--bone); font: bold 16px ui-monospace, Consolas, monospace; text-shadow: 2px 2px 0 var(--ink); text-align: right; }
  .hud small { display: block; font-size: 12px; color: var(--stone); font-weight: normal; }
  .overlay { position: fixed; inset: 0; display: grid; place-items: center; background: rgb(20 16 30 / 0.72); color: var(--bone); font: 16px/1.8 ui-monospace, Consolas, monospace; text-align: center; z-index: 50; }
  .overlay[hidden] { display: none; }
  .overlay h1 { font: 700 44px var(--title); letter-spacing: 0.2em; margin: 0 0 12px; color: var(--glow); }
  .overlay p { margin: 0; }
  .overlay .keys { color: var(--stone); margin-top: 16px; }

  /* ---------- Inventory panel ---------- */
  #inventory {
    position: fixed; right: 16px; top: 50%; transform: translateY(-50%); z-index: 20;
    padding: 12px 14px 14px; color: var(--bone); font: 13px var(--ui); cursor: default;
    background: linear-gradient(#231b30, #15111f);
    border: 2px solid var(--bark);
    box-shadow: inset 0 0 0 1px var(--oak), inset 0 0 0 3px #1a1424, 0 12px 32px rgb(0 0 0 / 0.6);
  }
  #inventory[hidden] { display: none; }
  #inventory h2 { font: 700 16px var(--title); letter-spacing: 0.14em; text-align: center; color: var(--glow); margin: 0 0 8px; }
  #invEquip { position: relative; width: 320px; height: 224px; }
  .slot { position: absolute; box-sizing: border-box; background: rgb(0 0 0 / 0.35); border: 1px solid var(--bark); display: grid; place-items: center; }
  .slot .ghost { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; opacity: 0.14; filter: grayscale(1); pointer-events: none; }
  #invStats { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 14px; margin: 10px 0; color: var(--stone); font-size: 12px; }
  #invStats b { color: var(--bone); font-variant-numeric: tabular-nums; }
  #invGrid {
    position: relative; width: 320px; height: 160px; box-sizing: content-box;
    border: 1px solid var(--bark); background-color: rgb(0 0 0 / 0.35);
    background-image: linear-gradient(var(--void) 1px, transparent 1px), linear-gradient(90deg, var(--void) 1px, transparent 1px);
    background-size: 32px 32px;
  }
  .item { position: absolute; box-sizing: border-box; display: grid; place-items: center; cursor: pointer; }
  .item img { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; pointer-events: none; }
  .item:hover { outline: 1px solid var(--bone); outline-offset: -1px; }
  .item.rarity-normal { background: rgb(184 173 156 / 0.10); }
  .item.rarity-magic { background: rgb(63 111 208 / 0.25); }
  .item.rarity-rare { background: rgb(245 213 98 / 0.16); }
  .preview { position: absolute; pointer-events: none; background: rgb(95 176 74 / 0.25); outline: 1px solid var(--moss); outline-offset: -1px; }
  .preview.bad { background: rgb(200 66 58 / 0.25); outline-color: var(--ember); }
  #held { position: fixed; z-index: 30; pointer-events: none; opacity: 0.9; }
  #held[hidden], .preview[hidden] { display: none; }

  /* ---------- Tooltip, ground labels, toast ---------- */
  #tooltip {
    position: fixed; z-index: 40; pointer-events: none; min-width: 170px; padding: 8px 14px 10px; text-align: center;
    background: rgb(14 11 22 / 0.96); border: 1px solid var(--oak); color: var(--stone); font: 13px/1.5 var(--ui);
  }
  #tooltip[hidden], #toast[hidden] { display: none; }
  .tip-name { font: 700 15px var(--title); letter-spacing: 0.03em; }
  .tip-base { color: var(--bone); }
  .tip-slot { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #6b5f78; margin-bottom: 4px; }
  .tip-stat { color: var(--bone); }
  .tip-mod { color: var(--magic); }
  .tip-name.rarity-normal, .label.rarity-normal { color: var(--bone); }
  .tip-name.rarity-magic, .label.rarity-magic { color: var(--magic); }
  .tip-name.rarity-rare, .label.rarity-rare { color: var(--glow); }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 10; overflow: hidden; }
  .label { position: absolute; left: 0; top: 0; padding: 1px 7px; white-space: nowrap; font: 700 12px var(--title); letter-spacing: 0.03em; background: rgb(14 11 22 / 0.78); border: 1px solid rgb(139 90 52 / 0.7); }
  #toast.good { color: var(--glow); }
  .tip-note { color: #6b5f78; font-size: 12px; font-style: italic; }
  #alert { position: fixed; left: 0; top: 0; z-index: 12; pointer-events: none; font: 700 30px var(--title); color: var(--glow); text-shadow: 2px 2px 0 var(--ink), 0 0 12px rgb(245 213 98 / 0.6); animation: pop 0.25s ease-out; }
  #alert[hidden] { display: none; }
  @keyframes pop { from { scale: 0.4; } to { scale: 1; } }
  #toast { position: fixed; top: 18%; left: 50%; transform: translateX(-50%); z-index: 45; color: var(--ember); font: 700 18px var(--title); text-shadow: 2px 2px 0 var(--ink); }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<canvas id="hudCanvas"></canvas>
<div id="labels"></div>
<div class="hud"><span id="hud"></span><small>I: inventory</small></div>

<div id="inventory" hidden>
  <h2>INVENTORY</h2>
  <div id="invEquip"></div>
  <div id="invStats"></div>
  <div id="invGrid"></div>
</div>
<div id="held" hidden></div>
<div id="tooltip" hidden></div>
<div id="toast" hidden></div>
<div id="alert" hidden>!</div>

<div class="overlay" id="overlay">
  <div>
    <h1>SIMPLICITY</h1>
    <p id="message">Press any key to begin</p>
    <p class="keys">WASD / arrows: move (double-tap to dash) &nbsp; Mouse: aim &nbsp; Space: jump &nbsp; J / click: attack &nbsp; I: inventory</p>
  </div>
</div>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
<script src="sprites.js"></script>
<script type="module" src="main.js"></script>
</body>
</html>
