<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simplicity</title>
</head>
<body>
<canvas id="screen"></canvas>
<canvas id="hudCanvas"></canvas>
<div id="labels"></div>
<div class="hud"><small>I: inventory &middot; hold R: reset</small></div>

<div id="inventory" hidden>
  <h2>INVENTORY</h2>
  <div id="invEquip"></div>
  <div id="invStats"></div>
  <div id="invGrid"></div>
</div>
<div id="held" hidden></div>
<div id="tooltip" hidden></div>
<div id="toast" hidden></div>
<div id="alert" hidden>!</div>
<div id="resetHold" hidden>RESETTING<div class="bar"><i></i></div></div>

<div class="overlay" id="overlay">
  <div>
    <h1>SIMPLICITY</h1>
    <p id="message">Press any key to begin</p>
    <p class="keys">WASD / arrows: move &middot; double-tap: dash<br>Mouse: aim &middot; Click / J: attack &middot; Space: jump<br>I: inventory &middot; Hold R: reset</p>
  </div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
