# The soak test (tests/soak.test.ts) dug deep: every night, and on demand, a monkey plays about in every
# area and every house many times over, each run with its own dice. The everyday test run plays once per
# area; this one plays fifty times, so a rare way of breaking the world turns up here before a player finds it.
name: Nightly soak

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      seeds:
        description: Runs per area, each with its own dice
        default: "50"

permissions:
  contents: read

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run assets
      - run: npx vitest run tests/soak.test.ts
        env:
          SOAK_SEEDS: ${{ github.event.inputs.seeds || '50' }}
