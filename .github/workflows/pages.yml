# Check, test, build and publish the game to GitHub Pages on every push to main.
# A failing lint, type check, test or end-to-end spec stops the deploy.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run assets
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The last week's builds' files go out alongside this one's. Every area but the first is its own file, fetched
      # the first time he goes there, by a name that changes with each build: a tab opened before this deploy still
      # asks for the old names, and would find them gone ("The way is blocked") without these.
      - uses: actions/cache/restore@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: old-assets
          key: old-assets-${{ github.run_id }}
          restore-keys: old-assets-
      - if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p old-assets
          find old-assets -type f -mtime +7 -delete
          cp dist/assets/* old-assets/
          for f in old-assets/*; do [ -e "dist/assets/${f##*/}" ] || cp -p "$f" dist/assets/; done
          ls dist/assets | wc -l
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: old-assets
          key: old-assets-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  # The story's big beats, played through in a real browser (e2e/): the road to the King, his audience
  # cutscene, the Grey Ringer's fight. A failure here stops the deploy too. Split three ways, in parallel:
  # software WebGL is slow, and one machine takes the specs about nine minutes.
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -- --shard=${{ matrix.shard }}/3
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          retention-days: 7

  deploy:
    needs: [build, e2e]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
